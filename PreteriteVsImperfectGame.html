<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Preterite vs Imperfect Practice</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --button-bg: #800020;
            --button-text: white;
            --correct-color: #4CAF50;
            --incorrect-color: #f44336;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .sentence-display {
            font-size: 1.2em;
            margin: 20px 0;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            line-height: 1.5;
        }

        .verb-infinitive {
            font-weight: bold;
            color: var(--button-bg);
        }

        .tense-selection {
            margin: 20px 0;
        }

        .tense-button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 1.1em;
            background-color: #f0f0f0;
            border: 2px solid var(--button-bg);
            border-radius: 4px;
            cursor: pointer;
            color: var(--button-bg);
            font-weight: bold;
            transition: all 0.3s;
        }

        .tense-button:hover {
            background-color: #e0e0e0;
        }

        .tense-button.selected {
            background-color: var(--button-bg);
            color: white;
        }

        .conjugation-input {
            display: none;
            margin: 20px 0;
        }

        .conjugation-input.visible {
            display: block;
        }

        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 10px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .feedback {
            margin: 20px 0;
            padding: 15px;
            border-radius: 4px;
            font-weight: bold;
        }

        .feedback-correct {
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--correct-color);
        }

        .feedback-partial {
            background-color: rgba(255, 152, 0, 0.1);
            color: #ff9800;
        }

        .feedback-incorrect {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--incorrect-color);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 1.1em;
        }

        .accent-buttons {
            margin: 10px 0;
        }

        .accent-button {
            padding: 5px 10px;
            margin: 0 2px;
            font-size: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--button-bg);
            transition: width 0.3s ease;
            width: 100%;
        }

        .timer {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            input[type="text"] {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <h1>Spanish Preterite vs Imperfect Practice</h1>
    
    <!-- Name Entry Section -->
    <div id="nameEntry" class="container">
        <h2>Enter Your Name</h2>
        <input type="text" id="playerName" placeholder="Your Name">
        <button onclick="submitName()">Start Game</button>
    </div>

    <!-- Game Section -->
    <div id="game" class="container" style="display: none;">
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="timer" id="timer">Time: 3:00</div>
        
        <div class="sentence-display" id="sentenceDisplay"></div>

        <div class="tense-selection">
            <h3>Select the correct tense:</h3>
            <button class="tense-button" onclick="selectTense('preterite')" id="preteriteBtn">Preterite</button>
            <button class="tense-button" onclick="selectTense('imperfect')" id="imperfectBtn">Imperfect</button>
        </div>

        <div class="conjugation-input" id="conjugationInput">
            <h3>Enter the correct conjugation:</h3>
            <input type="text" id="answer" placeholder="Type your answer">
            
            <div class="accent-buttons">
                <button onclick="insertAccent('á')" class="accent-button" title="Alt + a">á</button>
                <button onclick="insertAccent('é')" class="accent-button" title="Alt + e">é</button>
                <button onclick="insertAccent('í')" class="accent-button" title="Alt + i">í</button>
                <button onclick="insertAccent('ó')" class="accent-button" title="Alt + o">ó</button>
                <button onclick="insertAccent('ú')" class="accent-button" title="Alt + u">ú</button>
                <button onclick="insertAccent('ñ')" class="accent-button" title="Alt + n">ñ</button>
            </div>

            <button onclick="submitAnswer()">Submit</button>
        </div>
        
        <div id="feedback" class="feedback"></div>
        
        <div class="stats">
            <div id="score">Score: 0</div>
            <div id="streak">Current Streak: 0</div>
            <div id="highScore">Best Streak: 0</div>
        </div>
    </div>

    <!-- End Game Section -->
    <div id="end" class="container" style="display: none;">
        <div id="finalMessage"></div>
        <button onclick="restartGame()">Play Again</button>
    </div>

<script>
    // Game state variables
    let score = 0;
    let streak = 0;
    let bestStreak = 0;
    let timer = null;
    let timeLeft = 180; // 3 minutes
    let startTime = null;
    let gameActive = false;
    let playerName = '';
    let isProcessingAnswer = false;
    let totalAttempts = 0;
    let currentSentence = null;
    let selectedTense = null;

    // Practice sentences with their correct tenses and conjugations
    const sentences = [
        {
            text: "Cuando era niño, mi familia y yo (vivir) en Madrid.",
            verb: "vivir",
            subject: "yo",
            correctTense: "imperfect",
            preterite: "viví",
            imperfect: "vivía",
            context: "Background/habitual action in the past"
        },
        {
            text: "Ayer (llegar, yo) tarde a la clase.",
            verb: "llegar",
            subject: "yo",
            correctTense: "preterite",
            preterite: "llegué",
            imperfect: "llegaba",
            context: "Specific completed action"
        },
        {
            text: "Mientras (estudiar, yo), mi hermano (cocinar).",
            verb: "estudiar",
            subject: "yo",
            correctTense: "imperfect",
            preterite: "estudié",
            imperfect: "estudiaba",
            context: "Ongoing action in the past"
        },
        {
            text: "El año pasado (trabajar, él) en un restaurante.",
            verb: "trabajar",
            subject: "él",
            correctTense: "imperfect",
            preterite: "trabajó",
            imperfect: "trabajaba",
            context: "Extended period in the past"
        },
        {
            text: "De repente, (ver, ella) un accidente.",
            verb: "ver",
            subject: "ella",
            correctTense: "preterite",
            preterite: "vio",
            imperfect: "veía",
            context: "Sudden action"
        }
        // Add more sentences here...
    ];

    function generateQuestion() {
        currentSentence = sentences[Math.floor(Math.random() * sentences.length)];
        const sentenceDisplay = document.getElementById('sentenceDisplay');
        
        // Format the sentence, highlighting the infinitive verb
        const formattedText = currentSentence.text.replace(
            /\((.*?)\)/g, 
            '<span class="verb-infinitive">($1)</span>'
        );
        
        sentenceDisplay.innerHTML = formattedText;
        
        // Reset tense selection
        selectedTense = null;
        document.querySelectorAll('.tense-button').forEach(btn => {
            btn.classList.remove('selected');
        });
        
        // Hide conjugation input until tense is selected
        document.getElementById('conjugationInput').classList.remove('visible');
        document.getElementById('answer').value = '';
        document.getElementById('feedback').textContent = '';
    }

    function selectTense(tense) {
        selectedTense = tense;
        document.querySelectorAll('.tense-button').forEach(btn => {
            btn.classList.remove('selected');
        });
        document.getElementById(`${tense}Btn`).classList.add('selected');
        document.getElementById('conjugationInput').classList.add('visible');
        document.getElementById('answer').focus();
    }

    function submitAnswer() {
        if (!gameActive || isProcessingAnswer || !selectedTense) return;
        
        isProcessingAnswer = true;
        totalAttempts++;

        const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
        let points = 0;
        let feedback = '';

        // Check tense selection
        const correctTense = currentSentence.correctTense;
        const tenseCorrect = selectedTense === correctTense;
        
        // Check conjugation
        const correctConjugation = currentSentence[correctTense];
        const conjugationCorrect = userAnswer === correctConjugation;

        if (tenseCorrect && conjugationCorrect) {
            points = 2;
            feedback = `¡Perfecto! You got both the tense and conjugation correct! (+2 points)`;
            streak++;
        } else if (tenseCorrect) {
            points = 1;
            feedback = `Partial credit! You correctly identified the tense as ${correctTense}, but the conjugation should be "${correctConjugation}" (+1 point)`;
            streak = 0;
        } else {
            points = 0;
            feedback = `Incorrect. This sentence requires the ${correctTense} tense. The correct answer is "${correctConjugation}"`;
            streak = 0;
        }

        // Add context explanation
        feedback += `<br><br><em>Context: ${currentSentence.context}</em>`;

        score += points;
        if (streak > bestStreak) {
            bestStreak = streak;
            localStorage.setItem('preteriteImperfectGameBestStreak', bestStreak);
        }

        showFeedback(feedback, points);
        updateDisplay();
        
        if (window.nextQuestionTimeout) {
            clearTimeout(window.nextQuestionTimeout);
        }
        
        window.nextQuestionTimeout = setTimeout(() => {
            if (gameActive) {
                nextQuestion();
            }
        }, 3000);
    }

    function showFeedback(message, points) {
        const feedback = document.getElementById('feedback');
        feedback.innerHTML = message;
        if (points === 2) {
            feedback.className = 'feedback feedback-correct';
        } else if (points === 1) {
            feedback.className = 'feedback feedback-partial';
        } else {
            feedback.className = 'feedback feedback-incorrect';
        }
    }

    function startGame() {
        resetGameState();
        score = 0;
        streak = 0;
        totalAttempts = 0;
        gameActive = true;
        
        updateDisplay();
        startTimer();
        nextQuestion();
    }

    function nextQuestion() {
        if (!gameActive) return;
        
        isProcessingAnswer = false;
        generateQuestion();
    }

    function startTimer() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }

        startTime = Date.now();
        timeLeft = 180; // 3 minutes
        
        updateTimer();

        timer = setInterval(() => {
            const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
            timeLeft = Math.max(180 - elapsedSeconds, 0);
            
            updateTimer();
            
            if (timeLeft <= 0) {
                endGame();
            }
        }, 100);
    }

    function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const timerDisplay = document.getElementById('timer');
        if (timerDisplay) {
            timerDisplay.textContent = `Time: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        const progressFill = document.getElementById('progressFill');
        if (progressFill) {
            const percentageLeft = (timeLeft / 180) * 100;
            progressFill.style.width = `${percentageLeft}%`;
        }
    }

    function updateDisplay() {
        document.getElementById('score').textContent = `Score: ${score}`;
        document.getElementById('streak').textContent = `Current Streak: ${streak}`;
        document.getElementById('highScore').textContent = `Best Streak: ${bestStreak}`;
    }

    function submitName() {
        const nameInput = document.getElementById('playerName');
        playerName = nameInput.value.trim();
        if (playerName) {
            document.getElementById('nameEntry').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            startGame();
        } else {
            alert('Please enter your name to start');
            nameInput.focus();
        }
    }

    function endGame() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        
        gameActive = false;
        
        document.getElementById('game').style.display = 'none';
        document.getElementById('end').style.display = 'block';
        
        const percentage = totalAttempts > 0 ? Math.round((score / (totalAttempts * 2)) * 100) : 0;
        
        const finalMessage = document.getElementById('finalMessage');
        finalMessage.innerHTML = `
            <h2>¡Tiempo!</h2>
            <h3>Results for ${playerName}:</h3>
            <div class="results">
                <p><strong>Final Score:</strong> ${score}</p>
                <p><strong>Best Streak:</strong> ${bestStreak}</p>
                <p><strong>Accuracy:</strong> ${percentage}%</p>
                <p><strong>Total Attempts:</strong> ${totalAttempts}</p>
            </div>
        `;
    }

    function resetGameState() {
        if (window.nextQuestionTimeout) {
            clearTimeout(window.nextQuestionTimeout);
            window.nextQuestionTimeout = null;
        }
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        
        startTime = null;
        timeLeft = 180;
        isProcessingAnswer = false;
        gameActive = true;
        selectedTense = null;
        
        document.getElementById('answer').value = '';
        document.getElementById('feedback').textContent = '';
        document.querySelectorAll('.tense-button').forEach(btn => {
            btn.classList.remove('selected');
        });
        document.getElementById('conjugationInput').classList.remove('visible');
    }

    function insertAccent(accent) {
        const input = document.getElementById('answer');
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const text = input.value;
        input.value = text.slice(0, start) + accent + text.slice(end);
        input.selectionStart = input.selectionEnd = start + 1;
        input.focus();
    }

    function restartGame() {
        document.getElementById('end').style.display = 'none';
        document.getElementById('nameEntry').style.display = 'block';
        document.getElementById('playerName').value = '';
        document.getElementById('playerName').focus();
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
        // Add enter key handler for name input
        document.getElementById('playerName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitName();
            }
        });

        // Add enter key handler for answer input
        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isProcessingAnswer && selectedTense) {
                e.preventDefault();
                submitAnswer();
            }
        });

        // Add keyboard shortcuts for accents
        document.addEventListener('keydown', function(e) {
            if (e.altKey) {
                switch(e.key) {
                    case 'a': insertAccent('á'); break;
                    case 'e': insertAccent('é'); break;
                    case 'i': insertAccent('í'); break;
                    case 'o': insertAccent('ó'); break;
                    case 'u': insertAccent('ú'); break;
                    case 'n': insertAccent('ñ'); break;
                }
            }
        });

        // Load best streak from localStorage
        const savedBestStreak = localStorage.getItem('preteriteImperfectGameBestStreak');
        if (savedBestStreak) {
            bestStreak = parseInt(savedBestStreak);
        }
    });
</script>
</body>
</html>
