<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Imperfect Practice</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --button-bg: #800020;
            --button-text: white;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        h1, h2, h3 {
            font-family: 'Impact', sans-serif;
            color: var(--text-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .option-button {
            padding: 10px 20px;
            background-color: #f0f0f0;
            border: 2px solid var(--button-bg);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--button-bg);
            font-weight: bold;
            display: inline-block;
            margin: 5px;
        }

        .option-button:hover {
            background-color: #e0e0e0;
        }

        .option-button input[type="checkbox"] {
            margin-right: 8px;
        }

        .option-button.selected {
            background-color: var(--button-bg);
            color: white;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 10px;
            width: 300px;
        }

        .accent-buttons {
            margin: 10px 0;
        }

        .accent-button {
            padding: 5px 10px;
            margin: 0 2px;
            font-size: 16px;
        }

        .feedback {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }

        .feedback-correct {
            color: green;
        }

        .feedback-incorrect {
            color: red;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--button-bg);
            transition: width 0.3s ease;
            width: 100%;
        }

        .timer {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .verb-display {
            margin: 20px 0;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .verb-info {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--button-bg);
            margin-bottom: 10px;
        }

        .infinitive {
            font-style: italic;
            color: #666;
        }

        .results {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }

        .results p {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .results strong {
            color: var(--button-bg);
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            input[type="text"] {
                width: 80%;
            }
            .option-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h1>Spanish Imperfect Practice</h1>
    
    <!-- Name Entry Section -->
    <div id="nameEntry" class="container">
        <h2>Enter Your Name</h2>
        <input type="text" id="playerName" placeholder="Your Name">
        <button onclick="submitName()">Continue</button>
    </div>

    <!-- Options Section -->
    <div id="gameOptions" class="container" style="display: none;">
        <h2>Choose Your Practice Options</h2>
        
        <div class="options-container">
            <div>
                <h3>Verb Types:</h3>
                <div class="option-group" id="verbTypes">
                    <label class="option-button">
                        <input type="checkbox" value="ar" onchange="handleOptionChange(this, 'verbTypes')">
                        -AR Verbs
                    </label>
                    <label class="option-button">
                        <input type="checkbox" value="er" onchange="handleOptionChange(this, 'verbTypes')">
                        -ER Verbs
                    </label>
                    <label class="option-button">
                        <input type="checkbox" value="ir" onchange="handleOptionChange(this, 'verbTypes')">
                        -IR Verbs
                    </label>
                </div>
            </div>

            <div>
                <h3>Verb Categories:</h3>
                <div class="option-group" id="verbCategories">
                    <label class="option-button">
                        <input type="checkbox" value="regular" onchange="handleOptionChange(this, 'verbCategories')">
                        Regular
                    </label>
                    <label class="option-button">
                        <input type="checkbox" value="irregular" onchange="handleOptionChange(this, 'verbCategories')">
                        Irregular
                    </label>
                </div>
            </div>
        </div>

        <button onclick="startGameWithOptions()">Start Game</button>
    </div>

    <!-- Game Section -->
    <div id="game" class="container" style="display: none;">
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="timer" id="timer">Time: 2:00</div>
        
        <div class="verb-display">
            <div id="infinitive" class="infinitive"></div>
            <div id="pronoun" class="verb-info"></div>
        </div>

        <input type="text" id="answer" placeholder="Type your answer">
        
        <div class="accent-buttons">
            <button onclick="insertAccent('á')" class="accent-button" title="Alt + a">á</button>
            <button onclick="insertAccent('é')" class="accent-button" title="Alt + e">é</button>
            <button onclick="insertAccent('í')" class="accent-button" title="Alt + i">í</button>
            <button onclick="insertAccent('ó')" class="accent-button" title="Alt + o">ó</button>
            <button onclick="insertAccent('ú')" class="accent-button" title="Alt + u">ú</button>
            <button onclick="insertAccent('ñ')" class="accent-button" title="Alt + n">ñ</button>
        </div>

        <button onclick="submitAnswer()">Submit</button>
        
        <div id="feedback" class="feedback"></div>
        
        <div class="stats">
            <div id="score">Score: 0</div>
            <div id="streak">Current Streak: 0</div>
            <div id="highScore">Best Streak: 0</div>
        </div>
    </div>

    <!-- End Game Section -->
    <div id="end" class="container" style="display: none;">
        <div id="finalMessage"></div>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // Game state variables
        let score = 0;
        let streak = 0;
        let bestStreak = 0;
        let timer = null;
        let timeLeft = 120;
        let startTime = null;
        let gameActive = false;
        let playerName = '';
        let isProcessingAnswer = false;
        let totalAttempts = 0;
        let currentPronoun = '';
        let currentVerb = '';
        let selectedVerbTypes = new Set();
        let selectedCategories = new Set();

        // Regular verb conjugation patterns
        const regularPatterns = {
            'ar': {
                'yo': 'aba',
                'tú': 'abas',
                'él': 'aba',
                'ella': 'aba',
                'usted': 'aba',
                'nosotros': 'ábamos',
                'nosotras': 'ábamos',
                'ellos': 'aban',
                'ellas': 'aban',
                'ustedes': 'aban'
            },
            'er': {
                'yo': 'ía',
                'tú': 'ías',
                'él': 'ía',
                'ella': 'ía',
                'usted': 'ía',
                'nosotros': 'íamos',
                'nosotras': 'íamos',
                'ellos': 'ían',
                'ellas': 'ían',
                'ustedes': 'ían'
            },
            'ir': {
                'yo': 'ía',
                'tú': 'ías',
                'él': 'ía',
                'ella': 'ía',
                'usted': 'ía',
                'nosotros': 'íamos',
                'nosotras': 'íamos',
                'ellos': 'ían',
                'ellas': 'ían',
                'ustedes': 'ían'
            }
        };

        // Irregular verbs
        const irregularVerbs = {
            'ir': {
                'yo': 'iba',
                'tú': 'ibas',
                'él': 'iba',
                'ella': 'iba',
                'usted': 'iba',
                'nosotros': 'íbamos',
                'nosotras': 'íbamos',
                'ellos': 'iban',
                'ellas': 'iban',
                'ustedes': 'iban'
            },
            'ser': {
                'yo': 'era',
                'tú': 'eras',
                'él': 'era',
                'ella': 'era',
                'usted': 'era',
                'nosotros': 'éramos',
                'nosotras': 'éramos',
                'ellos': 'eran',
                'ellas': 'eran',
                'ustedes': 'eran'
            },
            'ver': {
                'yo': 'veía',
                'tú': 'veías',
                'él': 'veía',
                'ella': 'veía',
                'usted': 'veía',
                'nosotros': 'veíamos',
                'nosotras': 'veíamos',
                'ellos': 'veían',
                'ellas': 'veían',
                'ustedes': 'veían'
            }
        };

        // Regular verbs by type
        const regularVerbs = {
            'ar': ['hablar', 'trabajar', 'estudiar', 'caminar', 'bailar', 'cantar', 'escuchar', 'mirar', 'comprar', 'cocinar'],
            'er': ['comer', 'beber', 'correr', 'leer', 'aprender', 'vender', 'creer', 'deber', 'responder', 'comprender'],
            'ir': ['vivir', 'escribir', 'recibir', 'abrir', 'decidir', 'permitir', 'sufrir', 'existir', 'subir', 'describir']
        };

        function handleOptionChange(checkbox, group) {
            const label = checkbox.parentElement;
            label.classList.toggle('selected', checkbox.checked);
            
            if (group === 'verbTypes') {
                if (checkbox.checked) {
                    selectedVerbTypes.add(checkbox.value);
                } else {
                    selectedVerbTypes.delete(checkbox.value);
                }
            } else {
                if (checkbox.checked) {
                    selectedCategories.add(checkbox.value);
                } else {
                    selectedCategories.delete(checkbox.value);
                }
            }
        }

        function startGameWithOptions() {
            if (selectedVerbTypes.size === 0 || selectedCategories.size === 0) {
                alert('Please select at least one verb type and one category');
                return;
            }
            
            document.getElementById('gameOptions').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            startGame();
        }

        function generateQuestion() {
            const pronouns = ['yo', 'tú', 'él', 'ella', 'usted', 'nosotros', 'nosotras', 'ellos', 'ellas', 'ustedes'];
            currentPronoun = pronouns[Math.floor(Math.random() * pronouns.length)];

            // Select verb based on options
            let verbPool = [];
            
            // Add regular verbs if selected
            if (selectedCategories.has('regular')) {
                selectedVerbTypes.forEach(type => {
                    verbPool = verbPool.concat(regularVerbs[type]);
                });
            }
            
            // Add irregular verbs if selected
            if (selectedCategories.has('irregular')) {
                verbPool = verbPool.concat(Object.keys(irregularVerbs));
            }

            // If no verbs in pool (shouldn't happen due to start validation), use all verbs
            if (verbPool.length === 0) {
                alert('Please select at least one verb type and category');
                return;
            }

            currentVerb = verbPool[Math.floor(Math.random() * verbPool.length)];
            
            document.getElementById('infinitive').textContent = `Verb: ${currentVerb}`;
            document.getElementById('pronoun').textContent = currentPronoun;
        }

        // Add event listeners to the buttons
        const optionButtons = document.querySelectorAll('.option-button');
        optionButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove selected class from all buttons
                optionButtons.forEach(b => b.classList.remove('selected'));
                // Add selected class to the clicked button
                button.classList.add('selected');
            });
        });

        // Add event listener to the submit button
        const submitButton = document.getElementById('submit');
        submitButton.addEventListener('click', () => {
            // Get the selected option
            const selectedOption = document.querySelector('.option-button.selected');
            if (selectedOption) {
                const answer = document.getElementById('answer').value.trim();
                if (answer === selectedOption.textContent) {
                    alert('Correct!');
                } else {
                    alert('Incorrect. Please try again.');
                }
            } else {
                alert('Please select an option.');
            }
        });

        function submitAnswer() {
            if (!gameActive || isProcessingAnswer) return;
            
            isProcessingAnswer = true;
            totalAttempts++;

            const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
            let correctAnswer;

            // Determine correct answer based on verb type
            if (irregularVerbs[currentVerb]) {
                correctAnswer = irregularVerbs[currentVerb][currentPronoun];
            } else {
                const verbEnding = currentVerb.slice(-2);
                const verbStem = currentVerb.slice(0, -2);
                correctAnswer = verbStem + regularPatterns[verbEnding][currentPronoun];
            }
            
            if (userAnswer === correctAnswer) {
                score++;
                streak++;
                if (streak > bestStreak) {
                    bestStreak = streak;
                    localStorage.setItem('imperfectGameBestStreak', bestStreak);
                }
                showFeedback(true);
            } else {
                streak = 0;
                showFeedback(false, correctAnswer);
            }
            
            updateDisplay();
            
            if (window.nextVerbTimeout) {
                clearTimeout(window.nextVerbTimeout);
            }
            
            window.nextVerbTimeout = setTimeout(() => {
                if (gameActive) {
                    nextQuestion();
                }
            }, 1500);
        }

        function showFeedback(isCorrect, correctAnswer = '') {
            const feedback = document.getElementById('feedback');
            if (isCorrect) {
                feedback.textContent = '¡Correcto!';
                feedback.className = 'feedback feedback-correct';
            } else {
                feedback.textContent = `Incorrect. The correct answer is: ${correctAnswer}`;
                feedback.className = 'feedback feedback-incorrect';
            }
        }

        function startGame() {
            resetGameState();
            score = 0;
            streak = 0;
            totalAttempts = 0;
            gameActive = true;
            
            updateDisplay();
            startTimer();
            nextQuestion();
        }

        function nextQuestion() {
            if (!gameActive) return;
            
            isProcessingAnswer = false;
            
            if (window.nextVerbTimeout) {
                clearTimeout(window.nextVerbTimeout);
                window.nextVerbTimeout = null;
            }
            
            generateQuestion();
            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('answer').focus();
        }

        function startTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }

            startTime = Date.now();
            timeLeft = 120;
            
            updateTimer();

            timer = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                timeLeft = Math.max(120 - elapsedSeconds, 0);
                
                updateTimer();
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 100);
        }

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timerDisplay = document.getElementById('timer');
            if (timerDisplay) {
                timerDisplay.textContent = `Time: ${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
            
            const progressFill = document.getElementById('progressFill');
            if (progressFill) {
                const percentageLeft = (timeLeft / 120) * 100;
                progressFill.style.width = `${percentageLeft}%`;
            }
        }

        function updateDisplay() {
            document.getElementById('score').textContent = `Score: ${score}`;
            document.getElementById('streak').textContent = `Current Streak: ${streak}`;
            document.getElementById('highScore').textContent = `Best Streak: ${bestStreak}`;
        }

        function submitName() {
            const nameInput = document.getElementById('playerName');
            playerName = nameInput.value.trim();
            if (playerName) {
                document.getElementById('nameEntry').style.display = 'none';
                document.getElementById('gameOptions').style.display = 'block';
            } else {
                alert('Please enter your name to start');
                nameInput.focus();
            }
        }

        function endGame() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            gameActive = false;
            
            document.getElementById('game').style.display = 'none';
            document.getElementById('end').style.display = 'block';
            
            const percentage = totalAttempts > 0 ? Math.round((score / totalAttempts) * 100) : 0;
            
            const finalMessage = document.getElementById('finalMessage');
            finalMessage.innerHTML = `
                <h2>¡Tiempo!</h2>
                <h3>Results for ${playerName}:</h3>
                <div class="results">
                    <p><strong>Final Score:</strong> ${score}</p>
                    <p><strong>Best Streak:</strong> ${bestStreak}</p>
                    <p><strong>Accuracy:</strong> ${percentage}%</p>
                    <p><strong>Total Attempts:</strong> ${totalAttempts}</p>
                </div>
            `;
        }

        function resetGameState() {
            if (window.nextVerbTimeout) {
                clearTimeout(window.nextVerbTimeout);
                window.nextVerbTimeout = null;
            }
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            
            startTime = null;
            timeLeft = 120;
            isProcessingAnswer = false;
            gameActive = true;
            
            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';
        }

        function insertAccent(accent) {
            const input = document.getElementById('answer');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            input.value = text.slice(0, start) + accent + text.slice(end);
            input.selectionStart = input.selectionEnd = start + 1;
            input.focus();
        }

        function restartGame() {
            selectedVerbTypes.clear();
            selectedCategories.clear();
            // Reset all checkboxes
            document.querySelectorAll('.option-button input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
                checkbox.parentElement.classList.remove('selected');
            });
            document.getElementById('end').style.display = 'none';
            document.getElementById('nameEntry').style.display = 'block';
            document.getElementById('playerName').value = '';
            document.getElementById('playerName').focus();
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Add enter key handler for name input
            document.getElementById('playerName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitName();
                }
            });

            // Add enter key handler for answer input
            document.getElementById('answer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !isProcessingAnswer) {
                    e.preventDefault();
                    submitAnswer();
                }
            });

            // Add keyboard shortcuts for accents
            document.addEventListener('keydown', function(e) {
                if (e.altKey) {
                    switch(e.key) {
                        case 'a': insertAccent('á'); break;
                        case 'e': insertAccent('é'); break;
                        case 'i': insertAccent('í'); break;
                        case 'o': insertAccent('ó'); break;
                        case 'u': insertAccent('ú'); break;
                        case 'n': insertAccent('ñ'); break;
                    }
                }
            });

            // Load best streak from localStorage
            const savedBestStreak = localStorage.getItem('imperfectGameBestStreak');
            if (savedBestStreak) {
                bestStreak = parseInt(savedBestStreak);
            }
        });
    </script>
</body>
</html>
