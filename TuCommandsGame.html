<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Tú Commands Practice</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --button-bg: #800020;
            --button-text: white;
            --correct-color: #4CAF50;
            --incorrect-color: #f44336;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .mode-selection {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .mode-button {
            padding: 10px 20px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-button.selected {
            background-color: #4a0012;
            transform: scale(1.05);
        }

        .sentence-display {
            font-size: 1.2em;
            margin: 20px 0;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            line-height: 1.5;
        }

        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 10px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .feedback {
            margin: 20px 0;
            padding: 15px;
            border-radius: 4px;
            font-weight: bold;
        }

        .feedback-correct {
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--correct-color);
        }

        .feedback-incorrect {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--incorrect-color);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-size: 1.1em;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--button-bg);
            transition: width 0.3s ease;
            width: 100%;
        }

        .timer {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .conjugation-table {
            margin: 20px auto;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .show-hint {
            background-color: #f0f0f0;
            color: var(--text-color);
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            input[type="text"] {
                width: 80%;
            }
            .mode-selection {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h1>Spanish Tú Commands Practice</h1>
    
    <!-- Mode Selection Section -->
    <div id="modeSelection" class="container">
        <h2>Choose Practice Mode</h2>
        <div class="mode-selection">
            <button class="mode-button" onclick="selectMode('regular')">Regular Commands</button>
            <button class="mode-button" onclick="selectMode('irregular')">Irregular Commands</button>
            <button class="mode-button" onclick="selectMode('both')">Both</button>
        </div>
    </div>

    <!-- Name Entry Section -->
    <div id="nameEntry" class="container" style="display: none;">
        <h2>Enter Your Name</h2>
        <input type="text" id="playerName" placeholder="Your Name">
        <button onclick="submitName()">Start Game</button>
    </div>

    <!-- Game Section -->
    <div id="game" class="container" style="display: none;">
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="timer" id="timer">Time: 2:00</div>
        
        <div class="sentence-display" id="sentenceDisplay"></div>

        <div class="conjugation-input">
            <input type="text" id="answer" placeholder="Type your answer">
            <button onclick="submitAnswer()">Submit</button>
        </div>
        
        <button class="show-hint" onclick="toggleHint()">Show/Hide Command Rules</button>
        
        <div class="conjugation-table" id="conjugationTable">
            <h3>Irregular Tú Commands</h3>
            <table>
                <tr><td>decir</td><td>di</td></tr>
                <tr><td>hacer</td><td>haz</td></tr>
                <tr><td>ir</td><td>ve</td></tr>
                <tr><td>poner</td><td>pon</td></tr>
                <tr><td>salir</td><td>sal</td></tr>
                <tr><td>ser</td><td>sé</td></tr>
                <tr><td>tener</td><td>ten</td></tr>
                <tr><td>venir</td><td>ven</td></tr>
            </table>
        </div>
        
        <div id="feedback" class="feedback"></div>
        
        <div class="stats">
            <div id="score">Score: 0</div>
            <div id="streak">Current Streak: 0</div>
            <div id="highScore">Best Streak: 0</div>
        </div>
    </div>

    <!-- End Game Section -->
    <div id="end" class="container" style="display: none;">
        <div id="finalMessage"></div>
        <button onclick="restartGame()">Play Again</button>
    </div>

<script>
    // Game state variables
    let score = 0;
    let streak = 0;
    let bestStreak = 0;
    let timer = null;
    let timeLeft = 120; // 2 minutes
    let startTime = null;
    let gameActive = false;
    let playerName = '';
    let isProcessingAnswer = false;
    let totalAttempts = 0;
    let currentSentence = null;
    let gameMode = null;

    // Irregular commands
    const irregularCommands = [
        {
            infinitive: "decir",
            command: "di",
            translation: "say",
            example: "_____ la verdad.",
            exampleTranslation: "Tell the truth."
        },
        {
            infinitive: "hacer",
            command: "haz",
            translation: "do/make",
            example: "_____ tu tarea.",
            exampleTranslation: "Do your homework."
        },
        {
            infinitive: "ir",
            command: "ve",
            translation: "go",
            example: "_____ al mercado.",
            exampleTranslation: "Go to the market."
        },
        {
            infinitive: "poner",
            command: "pon",
            translation: "put",
            example: "_____ el libro en la mesa.",
            exampleTranslation: "Put the book on the table."
        },
        {
            infinitive: "salir",
            command: "sal",
            translation: "leave/go out",
            example: "_____ de la casa.",
            exampleTranslation: "Leave the house."
        },
        {
            infinitive: "ser",
            command: "sé",
            translation: "be",
            example: "_____ amable.",
            exampleTranslation: "Be kind."
        },
        {
            infinitive: "tener",
            command: "ten",
            translation: "have",
            example: "_____ paciencia.",
            exampleTranslation: "Have patience."
        },
        {
            infinitive: "venir",
            command: "ven",
            translation: "come",
            example: "_____ a mi casa.",
            exampleTranslation: "Come to my house."
        }
    ];

    // Regular commands
    const regularCommands = [
        {
            infinitive: "hablar",
            command: "habla",
            translation: "speak",
            example: "_____ más despacio.",
            exampleTranslation: "Speak more slowly."
        },
        {
            infinitive: "comer",
            command: "come",
            translation: "eat",
            example: "_____ tus verduras.",
            exampleTranslation: "Eat your vegetables."
        },
        {
            infinitive: "escribir",
            command: "escribe",
            translation: "write",
            example: "_____ tu nombre.",
            exampleTranslation: "Write your name."
        },
        {
            infinitive: "leer",
            command: "lee",
            translation: "read",
            example: "_____ el libro.",
            exampleTranslation: "Read the book."
        },
        {
            infinitive: "abrir",
            command: "abre",
            translation: "open",
            example: "_____ la puerta.",
            exampleTranslation: "Open the door."
        },
        {
            infinitive: "cerrar",
            command: "cierra",
            translation: "close",
            example: "_____ la ventana.",
            exampleTranslation: "Close the window."
        },
        {
            infinitive: "escuchar",
            command: "escucha",
            translation: "listen",
            example: "_____ la música.",
            exampleTranslation: "Listen to the music."
        },
        {
            infinitive: "mirar",
            command: "mira",
            translation: "look",
            example: "_____ el paisaje.",
            exampleTranslation: "Look at the landscape."
        },
        {
            infinitive: "cantar",
            command: "canta",
            translation: "sing",
            example: "_____ una canción.",
            exampleTranslation: "Sing a song."
        },
        {
            infinitive: "bailar",
            command: "baila",
            translation: "dance",
            example: "_____ conmigo.",
            exampleTranslation: "Dance with me."
        }
    ];

    function selectMode(mode) {
        gameMode = mode;
        document.querySelectorAll('.mode-button').forEach(button => {
            button.classList.remove('selected');
        });
        document.querySelector(`button[onclick="selectMode('${mode}')"]`).classList.add('selected');
        
        document.getElementById('modeSelection').style.display = 'none';
        document.getElementById('nameEntry').style.display = 'block';
    }

    function generateQuestion() {
        if (!gameActive) return;

        let availableCommands;
        switch(gameMode) {
            case 'regular':
                availableCommands = regularCommands;
                break;
            case 'irregular':
                availableCommands = irregularCommands;
                break;
            case 'both':
                availableCommands = [...regularCommands, ...irregularCommands];
                break;
        }

        currentSentence = availableCommands[Math.floor(Math.random() * availableCommands.length)];
        document.getElementById('sentenceDisplay').innerHTML = 
            `<p>Command form of "${currentSentence.infinitive}" (${currentSentence.translation})</p>
             <p>${currentSentence.example}</p>
             <p class="translation">${currentSentence.exampleTranslation}</p>`;
        
        document.getElementById('answer').value = '';
        document.getElementById('feedback').textContent = '';
    }

    function submitAnswer() {
        if (!gameActive || isProcessingAnswer) return;
        
        isProcessingAnswer = true;
        totalAttempts++;

        const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
        const correctAnswer = currentSentence.command.toLowerCase();
        const isCorrect = userAnswer === correctAnswer;

        if (isCorrect) {
            score++;
            streak++;
            showFeedback(`¡Correcto! "${correctAnswer}" is correct.`, true);
        } else {
            streak = 0;
            showFeedback(`Incorrect. The correct command form is "${correctAnswer}".`, false);
        }

        if (streak > bestStreak) {
            bestStreak = streak;
            localStorage.setItem('commandsGameBestStreak', bestStreak);
        }

        updateDisplay();
        
        if (window.nextQuestionTimeout) {
            clearTimeout(window.nextQuestionTimeout);
        }
        
        window.nextQuestionTimeout = setTimeout(() => {
            if (gameActive) {
                nextQuestion();
            }
        }, 2000);
    }

    function showFeedback(message, isCorrect) {
        const feedback = document.getElementById('feedback');
        feedback.textContent = message;
        feedback.className = `feedback ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}`;
    }

    function startGame() {
        resetGameState();
        score = 0;
        streak = 0;
        totalAttempts = 0;
        gameActive = true;
        
        updateDisplay();
        startTimer();
        nextQuestion();
    }

    function nextQuestion() {
        if (!gameActive) return;
        
        isProcessingAnswer = false;
        generateQuestion();
        document.getElementById('answer').focus();
    }

    function startTimer() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }

        startTime = Date.now();
        timeLeft = 120; // 2 minutes
        
        updateTimer();

        timer = setInterval(() => {
            const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
            timeLeft = Math.max(120 - elapsedSeconds, 0);
            
            updateTimer();
            
            if (timeLeft <= 0) {
                endGame();
            }
        }, 100);
    }

    function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const timerDisplay = document.getElementById('timer');
        if (timerDisplay) {
            timerDisplay.textContent = `Time: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        const progressFill = document.getElementById('progressFill');
        if (progressFill) {
            const percentageLeft = (timeLeft / 120) * 100;
            progressFill.style.width = `${percentageLeft}%`;
        }
    }

    function updateDisplay() {
        document.getElementById('score').textContent = `Score: ${score}`;
        document.getElementById('streak').textContent = `Current Streak: ${streak}`;
        document.getElementById('highScore').textContent = `Best Streak: ${bestStreak}`;
    }

    function submitName() {
        const nameInput = document.getElementById('playerName');
        playerName = nameInput.value.trim();
        if (!playerName) {
            alert('Please enter your name to start');
            nameInput.focus();
            return;
        }
        
        document.getElementById('nameEntry').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        startGame();
    }

    function endGame() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        
        gameActive = false;
        
        document.getElementById('game').style.display = 'none';
        document.getElementById('end').style.display = 'block';
        
        const percentage = totalAttempts > 0 ? Math.round((score / totalAttempts) * 100) : 0;
        
        const finalMessage = document.getElementById('finalMessage');
        finalMessage.innerHTML = `
            <h2>¡Tiempo!</h2>
            <h3>Results for ${playerName}:</h3>
            <div class="results">
                <p><strong>Final Score:</strong> ${score}</p>
                <p><strong>Best Streak:</strong> ${bestStreak}</p>
                <p><strong>Accuracy:</strong> ${percentage}%</p>
                <p><strong>Total Attempts:</strong> ${totalAttempts}</p>
            </div>
        `;
    }

    function resetGameState() {
        if (window.nextQuestionTimeout) {
            clearTimeout(window.nextQuestionTimeout);
            window.nextQuestionTimeout = null;
        }
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        
        startTime = null;
        timeLeft = 120;
        isProcessingAnswer = false;
        gameActive = true;
        
        document.getElementById('answer').value = '';
        document.getElementById('feedback').textContent = '';
        document.getElementById('conjugationTable').style.display = 'none';
    }

    function toggleHint() {
        const table = document.getElementById('conjugationTable');
        table.style.display = table.style.display === 'none' ? 'block' : 'none';
    }

    function restartGame() {
        document.getElementById('end').style.display = 'none';
        document.getElementById('modeSelection').style.display = 'block';
        document.getElementById('playerName').value = '';
        gameMode = null;
        document.querySelectorAll('.mode-button').forEach(button => {
            button.classList.remove('selected');
        });
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
        // Add enter key handler for name input
        document.getElementById('playerName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitName();
            }
        });

        // Add enter key handler for answer input
        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isProcessingAnswer) {
                e.preventDefault();
                submitAnswer();
            }
        });

        // Load best streak from localStorage
        const savedBestStreak = localStorage.getItem('commandsGameBestStreak');
        if (savedBestStreak) {
            bestStreak = parseInt(savedBestStreak);
        }
    });
</script>
</body>
</html>
