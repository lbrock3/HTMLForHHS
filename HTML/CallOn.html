<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Señor Brock's Totally Awesome Random Student Caller</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --button-bg: #800020;
            --button-text: white;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #studentDisplay {
            font-size: 24px;
            font-family: 'Impact', sans-serif;
            margin: 20px 0;
            white-space: pre-wrap;
            padding: 20px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
            color: var(--button-bg);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .controls {
            margin: 20px 0;
        }

        #studentCount {
            margin: 10px 0;
            font-size: 24px;
            font-family: 'Impact', sans-serif;
            color: #666666;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        #studentSelectInput {
            margin: 10px;
            padding: 5px;
            font-size: 16px;
            width: 100px;
        }

        .theme-toggle {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .theme-option {
            margin: 8px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .theme-option input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
        }

        .theme-option label {
            cursor: pointer;
            user-select: none;
        }

        .dark-mode-toggle,
        .dark-mode-toggle .moon,
        .dark-mode-toggle .sun,
        .dark-mode .dark-mode-toggle,
        .dark-mode .dark-mode-toggle .moon,
        .dark-mode .dark-mode-toggle .sun {
            display: none;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading::after {
            content: '';
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--button-bg);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            z-index: 1000;
        }

        .keyboard-shortcut {
            display: inline-block;
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-left: 5px;
        }

        .progress-container {
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--button-bg);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 20px;
            color: var(--text-color);
            font-weight: bold;
            mix-blend-mode: difference;
        }

        .settings-panel {
            display: none;
        }

        .error-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4444;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translate(-50%, -100%); }
            to { transform: translate(-50%, 0); }
        }

        button:focus-visible {
            outline: 3px solid var(--button-bg);
            outline-offset: 2px;
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--button-bg);
            color: white;
            padding: 8px;
            z-index: 100;
            transition: top 0.3s;
        }

        .skip-link:focus {
            top: 0;
        }

        .theme-toggle, .theme-option {
            display: none;
        }

        .called-student {
            font-size: 48px;
            font-family: 'Impact', sans-serif;
            color: var(--button-bg);
            padding: 30px;
            margin: 30px 0;
            animation: popIn 0.5s ease-out;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-family: 'Impact', sans-serif;
            color: var(--text-color);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }

        .modal button {
            display: block;
            width: 200px;
            margin: 10px auto;
            padding: 10px;
            opacity: 0;
            animation: buttonSlideIn 0.3s ease forwards;
        }
        
        #sameOrder, #newOrder, #cancelReset {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        #sameOrder:hover, #newOrder:hover, #cancelReset:hover {
            transform: translateY(-2px);
        }
        
        #cancelReset {
            background-color: #666;
        }

        .modal button:nth-child(1) { animation-delay: 0.1s; }
        .modal button:nth-child(2) { animation-delay: 0.2s; }
        .modal button:nth-child(3) { animation-delay: 0.3s; }

        @keyframes buttonSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div role="main" aria-label="Student Caller Application">
        <h1>Señor Brock's Totally Awesome Random Student Caller</h1>
        
        <div role="status" 
             aria-live="polite" 
             aria-atomic="true" 
             id="studentCount">
        </div>

        <div role="alert" 
             aria-live="polite" 
             aria-atomic="true" 
             id="studentDisplay">
            Upload a CSV file to begin or continue with the saved list!
        </div>

        <div class="controls" role="toolbar" aria-label="Student management controls">
            <input type="file" 
                   id="uploadCSV" 
                   accept=".csv"
                   aria-label="Upload CSV file with student names">
            <button id="saveListBtn" aria-label="Save current student list">
                Save Current List
            </button>
            <button id="callStudentBtn" 
                    disabled 
                    aria-label="Call on next student">
                Call Next Student
            </button>
            <button id="resetBtn" disabled data-tooltip="Reset student list">
                Start Over
                <!--<span class="keyboard-shortcut"></span> -->
            </button>
            <button id="createGroupsBtn" disabled>Create Groups</button>
            <button id="assignNumbersBtn" disabled>Assign Random Numbers</button>
            <button id="selectStudentsBtn" disabled>Select & Number Students</button>
            <button id="markAbsencesBtn" disabled>Mark Absences</button>
        </div>

        <div class="progress-container" role="progressbar" 
             aria-valuemin="0" 
             aria-valuemax="100" 
             aria-valuenow="0"
             aria-label="Progress through student list">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-text" id="progressText"></div>
            </div>
        </div>
    </div>

    <div id="groupModal" class="modal">
        <h2>Create Groups</h2>
        <div>
            <button id="byGroupCount">By Number of Groups</button>
            <button id="byGroupSize">By Group Size</button>
        </div>
        <input type="number" id="groupInput" min="1" style="display: none;">
        <button id="confirmGroups" style="display: none;">Create</button>
        <button id="cancelGroups">Cancel</button>
    </div>
    <div id="modalBackdrop" class="modal-backdrop"></div>

    <div id="selectStudentsModal" class="modal">
        <h2>Select & Number Students</h2>
        <p>How many students would you like to randomly select and number?</p>
        <input type="number" id="studentSelectInput" min="1">
        <button id="confirmSelection">Select & Number</button>
        <button id="cancelSelection">Cancel</button>
    </div>

    <div id="absencesModal" class="modal">
        <h2>Mark Absent Students</h2>
        <p>Select students who are absent today:</p>
        <div id="studentCheckboxes" style="max-height: 300px; overflow-y: auto; text-align: left; padding: 10px;">
            <!-- Checkboxes will be added here dynamically -->
        </div>
        <button id="confirmAbsences">Confirm</button>
        <button id="cancelAbsences">Cancel</button>
    </div>

    <script>
        class AppError extends Error {
            constructor(message, context) {
                super(message);
                this.context = context;
            }
        }

        function handleError(error, context) {
            console.error(`Error in ${context}:`, error);
            
            const message = error instanceof AppError 
                ? error.message 
                : `An error occurred while ${context}. Please try again.`;
                
            showErrorMessage(message);
        }

        function showErrorMessage(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => errorDiv.remove(), 3000);
        }

        // Create separate modules for related functionality
        const StudentManager = {
            list: [],
            shuffled: [],
            absent: new Set(),
            
            shuffle() {
                const presentStudents = this.list.filter(student => !this.absent.has(student));
                this.shuffled = [...presentStudents].sort(() => Math.random() - 0.5);
                updateStudentCount();
            },
            
            callNext() {
                if (this.shuffled.length === 0) return null;
                return this.shuffled.shift();
            }
        };

        const UIManager = {
            updateDisplay(message) {
                document.getElementById("studentDisplay").textContent = message;
            },
            
            updateStudentCount() {
                // ... count update logic ...
            }
        };

        let studentList = [];
        let shuffledStudents = [];
        let absentStudents = new Set();
        let previousOrder = []; // Store the previous order of students

        // Add to global variables
        const actionHistory = {
            undoStack: [],
            redoStack: [],
            maxSize: 50
        };

        function saveState(action) {
            actionHistory.undoStack.push({
                shuffledStudents: [...shuffledStudents],
                absentStudents: new Set(absentStudents),
                action
            });
            if (actionHistory.undoStack.length > actionHistory.maxSize) {
                actionHistory.undoStack.shift();
            }
            actionHistory.redoStack = [];
        }

        function undo() {
            if (actionHistory.undoStack.length === 0) return;
            
            const currentState = {
                shuffledStudents: [...shuffledStudents],
                absentStudents: new Set(absentStudents)
            };
            actionHistory.redoStack.push(currentState);
            
            const previousState = actionHistory.undoStack.pop();
            shuffledStudents = [...previousState.shuffledStudents];
            absentStudents = new Set(previousState.absentStudents);
            
            updateDisplay(`Undid: ${previousState.action}`);
            updateStudentCount();
        }

        // Initialize app functionality
        function init() {
            loadSavedList();
            // Load previous order if available
            const savedPreviousOrder = localStorage.getItem('previousOrder');
            if (savedPreviousOrder) {
                previousOrder = JSON.parse(savedPreviousOrder);
            }
            if (studentList.length > 0) {
                shuffleStudents();
                updateDisplay("Saved student list loaded! Ready to begin.");
                enableButtons(true);
            } else {
                updateDisplay("Upload a CSV file to begin!");
                enableButtons(false);
            }
            updateStudentCount();
        }

        function updateDisplay(message) {
            document.getElementById("studentDisplay").textContent = message;
        }

        function enableButtons(enable) {
            document.getElementById("callStudentBtn").disabled = !enable;
            document.getElementById("resetBtn").disabled = !enable;
            document.getElementById("createGroupsBtn").disabled = !enable;
            document.getElementById("assignNumbersBtn").disabled = !enable;
            document.getElementById("selectStudentsBtn").disabled = !enable;
            document.getElementById("markAbsencesBtn").disabled = !enable;
        }

        function shuffleStudents() {
            const presentStudents = studentList.filter(student => !absentStudents.has(student));
            storePreviousOrder();
            shuffledStudents = [...presentStudents].sort(() => Math.random() - 0.5);
            updateStudentCount();
        }

        function validateCSV(file) {
            const allowedTypes = ['text/csv', 'application/vnd.ms-excel'];
            const maxSize = 1024 * 1024; // 1MB

            try {
                if (!allowedTypes.includes(file.type)) {
                    throw new Error('Please upload a valid CSV file');
                }

                if (file.size > maxSize) {
                    throw new Error('File size must be less than 1MB');
                }

                return true;
            } catch (error) {
                // Clear the file input when there's an error
                document.getElementById("uploadCSV").value = "";
                throw error;
            }
        }

        function readCSV(file) {
            try {
                validateCSV(file);
                showLoading();
                
                const reader = new FileReader();
                reader.onload = handleCSVLoad;
                reader.onerror = () => handleError(reader.error, 'reading file');
                reader.readAsText(file);
            } catch (error) {
                handleError(error, 'validating file');
            }
        }

        function handleCSVLoad(e) {
            try {
                const rows = e.target.result.split("\n").map(row => row.split(","));
                const header = rows[0];
                const firstNameIndex = header.indexOf("First Name");
                const lastNameIndex = header.indexOf("Last Name");

                if (firstNameIndex === -1 || lastNameIndex === -1) {
                    throw new Error("CSV file must contain 'First Name' and 'Last Name' columns.");
                }

                studentList = rows.slice(1)
                    .filter(row => row[firstNameIndex] && row[lastNameIndex])
                    .map(row => {
                        try {
                            const { firstName, lastName } = validateStudentName(
                                `${row[firstNameIndex].trim()} ${row[lastNameIndex].trim()}`
                            );
                            return `${firstName} ${lastName}`;
                        } catch (error) {
                            console.warn(`Skipping invalid name: ${row[firstNameIndex]} ${row[lastNameIndex]}`);
                            return null;
                        }
                    })
                    .filter(name => name !== null);

                if (studentList.length === 0) {
                    throw new Error("No valid students found in the CSV file.");
                }

                shuffleStudents();
                updateDisplay("Student list loaded! Ready to begin.");
                enableButtons(true);
                hideLoading();
            } catch (error) {
                handleError(error, 'processing CSV file');
                hideLoading();
            }
        }

        function callNextStudent() {
            try {
                if (shuffledStudents.length === 0) {
                    updateDisplay(`All students have been called!\n\nClick "Start Over" to begin again with the same students.`);
                    document.getElementById("resetBtn").disabled = false;
                    document.getElementById("callStudentBtn").disabled = true;
                    document.getElementById("createGroupsBtn").disabled = true;
                    return;
                }

                const nextStudent = shuffledStudents.shift();
                updateDisplay(`Calling on student:\n\n<div class="called-student">${nextStudent}</div>`);
                document.getElementById("studentDisplay").innerHTML = document.getElementById("studentDisplay").textContent;
                updateStudentCount();
            } catch (error) {
                handleError(error, 'calling next student');
            }
        }

        async function confirmAction(message, action) {
            const confirmed = await showConfirmDialog(message);
            if (confirmed) {
                try {
                    await action();
                } catch (error) {
                    handleError(error, 'performing action');
                }
            }
        }

        async function reset() {
            try {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.style.display = 'block';
                modal.innerHTML = `
                    <h2 id="resetModalTitle">Reset Options</h2>
                    <p id="resetModalDesc">How would you like to restart the list?</p>
                    <div role="dialog" 
                         aria-labelledby="resetModalTitle" 
                         aria-describedby="resetModalDesc">
                        <button id="sameOrder" aria-label="Reset with same student order">Use Same Order</button>
                        <button id="newOrder" aria-label="Reset with new random order">New Random Order</button>
                        <button id="cancelReset" aria-label="Cancel reset">Cancel</button>
                    </div>
                `;

                const backdrop = document.getElementById('modalBackdrop');
                backdrop.style.display = 'block';
                document.body.appendChild(modal);

                return new Promise((resolve, reject) => {
                    const cleanup = () => {
                        modal.remove();
                        backdrop.style.display = 'none';
                    };

                    const handleError = (error) => {
                        cleanup();
                        reject(error);
                    };

                    try {
                        modal.querySelector('#sameOrder').addEventListener('click', () => {
                            try {
                                shuffledStudents = [...previousOrder];
                                updateDisplay("Student list has been reset with the same order. Ready to begin!");
                                enableButtons(true);
                                updateStudentCount();
                                cleanup();
                                resolve();
                            } catch (error) {
                                handleError(error);
                            }
                        });

                        modal.querySelector('#newOrder').addEventListener('click', () => {
                            try {
                                shuffleStudents();
                                updateDisplay("Student list has been reset with a new random order. Ready to begin!");
                                enableButtons(true);
                                updateStudentCount();
                                cleanup();
                                resolve();
                            } catch (error) {
                                handleError(error);
                            }
                        });

                        modal.querySelector('#cancelReset').addEventListener('click', () => {
                            cleanup();
                            resolve();
                        });
                    } catch (error) {
                        handleError(error);
                    }
                });
            } catch (error) {
                handleError(error, 'resetting student list');
            }
        }

        function createGroups() {
            document.getElementById("groupModal").style.display = "block";
            document.getElementById("modalBackdrop").style.display = "block";
            document.getElementById("groupInput").style.display = "none";
            document.getElementById("confirmGroups").style.display = "none";
        }

        function divideIntoGroupsByCount(numGroups) {
            const groups = [];
            const groupSize = Math.ceil(shuffledStudents.length / numGroups);
            for (let i = 0; i < shuffledStudents.length; i += groupSize) {
                groups.push(shuffledStudents.slice(i, i + groupSize));
            }
            displayGroups(groups);
        }

        function divideIntoGroupsBySize(groupSize) {
            const groups = [];
            for (let i = 0; i < shuffledStudents.length; i += groupSize) {
                groups.push(shuffledStudents.slice(i, i + groupSize));
            }
            displayGroups(groups);
        }

        function displayGroups(groups) {
            let displayText = "Groups:\n";
            groups.forEach((group, index) => {
                displayText += `Group ${index + 1}: ${group.join(", ")}\n\n`;
            });
            updateDisplay(displayText.trim());
        }

        function saveList() {
            localStorage.setItem("studentList", JSON.stringify(studentList));
            alert("Student list saved!");
        }

        function loadSavedList() {
            const savedList = localStorage.getItem("studentList");
            if (savedList) {
                studentList = JSON.parse(savedList);
            }
        }

        function updateStudentCount() {
            const remaining = shuffledStudents.length;
            const present = studentList.length - absentStudents.size;
            const total = studentList.length;
            const percent = ((total - remaining) / total) * 100;
            
            // Update count display
            const countText = `Students remaining: ${remaining}/${present} (${total - present} absent)`;
            document.getElementById("studentCount").textContent = countText;
            
            // Update progress bar
            const progressFill = document.getElementById("progressFill");
            const progressText = document.getElementById("progressText");
            const progressContainer = document.querySelector('.progress-container');
            
            progressFill.style.width = `${percent}%`;
            progressText.textContent = `${Math.round(percent)}% Complete`;
            
            // Update ARIA attributes
            progressContainer.setAttribute('aria-valuenow', Math.round(percent));
            progressContainer.setAttribute('aria-label', 
                `Progress through student list: ${Math.round(percent)}% complete`);
        }

        // Add these new functions for the modal
        function setupGroupModal() {
            const modal = document.getElementById("groupModal");
            const backdrop = document.getElementById("modalBackdrop");
            const input = document.getElementById("groupInput");
            const confirm = document.getElementById("confirmGroups");
            let groupMode = null;

            document.getElementById("byGroupCount").addEventListener("click", () => {
                groupMode = "count";
                input.placeholder = "Enter number of groups";
                showInputAndConfirm();
            });

            document.getElementById("byGroupSize").addEventListener("click", () => {
                groupMode = "size";
                input.placeholder = "Enter size of each group";
                showInputAndConfirm();
            });

            document.getElementById("confirmGroups").addEventListener("click", () => {
                const value = parseInt(input.value, 10);
                if (value <= 0 || isNaN(value)) {
                    alert("Please enter a valid number");
                    return;
                }
                if (groupMode === "count") {
                    divideIntoGroupsByCount(value);
                } else {
                    divideIntoGroupsBySize(value);
                }
                closeModal();
            });

            document.getElementById("cancelGroups").addEventListener("click", closeModal);
            backdrop.addEventListener("click", closeModal);

            function showInputAndConfirm() {
                input.style.display = "block";
                confirm.style.display = "block";
                input.focus();
            }

            function closeModal() {
                modal.style.display = "none";
                backdrop.style.display = "none";
                input.value = "";
            }
        }

        function assignRandomNumbers() {
            // Create array of numbers from 1 to studentList.length
            const numbers = Array.from({length: studentList.length}, (_, i) => i + 1);
            
            // Shuffle the numbers
            const shuffledNumbers = [...numbers].sort(() => Math.random() - 0.5);
            
            // Combine students with their numbers
            const assignedStudents = studentList.map((student, index) => 
                `${shuffledNumbers[index]}. ${student}`
            );
            
            // Display the results sorted by number
            let displayText = "Assigned Numbers:\n\n";
            displayText += assignedStudents.sort((a, b) => {
                const numA = parseInt(a.split('.')[0]);
                const numB = parseInt(b.split('.')[0]);
                return numA - numB;
            }).join('\n');
            
            updateDisplay(displayText);
        }

        function setupSelectStudentsModal() {
            const modal = document.getElementById("selectStudentsModal");
            const backdrop = document.getElementById("modalBackdrop");
            const input = document.getElementById("studentSelectInput");

            document.getElementById("selectStudentsBtn").addEventListener("click", () => {
                modal.style.display = "block";
                backdrop.style.display = "block";
                input.value = "";
                input.max = studentList.length;
                input.focus();
            });

            document.getElementById("confirmSelection").addEventListener("click", () => {
                const numStudents = parseInt(input.value, 10);
                if (isNaN(numStudents) || numStudents <= 0 || numStudents > studentList.length) {
                    alert(`Please enter a number between 1 and ${studentList.length}`);
                    return;
                }
                selectRandomStudents(numStudents);
                closeSelectModal();
            });

            document.getElementById("cancelSelection").addEventListener("click", closeSelectModal);

            function closeSelectModal() {
                modal.style.display = "none";
                backdrop.style.display = "none";
            }
        }

        function selectRandomStudents(numStudents) {
            // Create a copy of the student list and shuffle it
            const shuffled = [...studentList].sort(() => Math.random() - 0.5);
            
            // Take the first numStudents from the shuffled array
            const selectedStudents = shuffled.slice(0, numStudents);
            
            // Assign numbers 1 through numStudents to the selected students
            const numberedStudents = selectedStudents.map((student, index) => 
                `${index + 1}. ${student}`
            );
            
            // Display the results with a clearer message
            let displayText = `Randomly Selected and Numbered ${numStudents} Students:\n\n`;
            displayText += numberedStudents.join('\n');
            
            updateDisplay(displayText);
        }

        function setupAbsencesModal() {
            const modal = document.getElementById("absencesModal");
            const backdrop = document.getElementById("modalBackdrop");
            const checkboxesDiv = document.getElementById("studentCheckboxes");

            document.getElementById("markAbsencesBtn").addEventListener("click", () => {
                // Create checkboxes for each student
                checkboxesDiv.innerHTML = studentList.map((student, index) => `
                    <div>
                        <input type="checkbox" id="student${index}" 
                               ${absentStudents.has(student) ? 'checked' : ''}>
                        <label for="student${index}">${student}</label>
                    </div>
                `).join('');

                modal.style.display = "block";
                backdrop.style.display = "block";
            });

            document.getElementById("confirmAbsences").addEventListener("click", () => {
                absentStudents.clear();
                studentList.forEach((student, index) => {
                    if (document.getElementById(`student${index}`).checked) {
                        absentStudents.add(student);
                    }
                });
                updateAbsenceDisplay();
                closeAbsencesModal();
                // Reshuffle the list excluding absent students
                shuffleStudents();
            });

            document.getElementById("cancelAbsences").addEventListener("click", closeAbsencesModal);

            function closeAbsencesModal() {
                modal.style.display = "none";
                backdrop.style.display = "none";
            }
        }

        function updateAbsenceDisplay() {
            const count = absentStudents.size;
            if (count > 0) {
                const absentList = Array.from(absentStudents).join(", ");
                updateDisplay(`Absent Students (${count}): ${absentList}\n\nReady to begin!`);
            }
        }

        // Event listeners
        document.getElementById("uploadCSV").addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (file) {
                readCSV(file);
            }
        });

        document.getElementById("saveListBtn").addEventListener("click", saveList);
        document.getElementById("callStudentBtn").addEventListener("click", callNextStudent);
        document.getElementById("resetBtn").addEventListener("click", reset);
        document.getElementById("createGroupsBtn").addEventListener("click", createGroups);
        document.getElementById("assignNumbersBtn").addEventListener("click", assignRandomNumbers);
        document.getElementById("selectStudentsBtn").addEventListener("click", setupSelectStudentsModal);
        document.getElementById("markAbsencesBtn").addEventListener("click", setupAbsencesModal);

        document.addEventListener("DOMContentLoaded", () => {
            setupGroupModal();
            setupSelectStudentsModal();
            setupAbsencesModal();
        });

        // Initialize the app
        init();

        // Add styles for the checkboxes
        const style = document.createElement('style');
        style.textContent = `
            #studentCheckboxes div {
                margin: 8px 0;
            }
            #studentCheckboxes label {
                margin-left: 8px;
                cursor: pointer;
            }
            #studentCheckboxes input[type="checkbox"] {
                cursor: pointer;
            }
        `;
        document.head.appendChild(style);

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Only handle shortcuts if no modal is open
                if (document.querySelector('.modal[style*="display: block"]')) return;
                
                switch(e.key.toLowerCase()) {
                    case 'n': // Next student
                        if (!document.getElementById("callStudentBtn").disabled) {
                            callNextStudent();
                        }
                        break;
                    case 'r': // Reset
                        if (!document.getElementById("resetBtn").disabled) {
                            reset();
                        }
                        break;
                    case 'd': // Dark mode toggle
                        document.getElementById("darkModeBtn").click();
                        break;
                }
            });
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.className = 'loading';
            document.body.appendChild(loader);
        }

        function hideLoading() {
            const loader = document.querySelector('.loading');
            if (loader) loader.remove();
        }

        // Add keyboard shortcuts for undo/redo
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
            }
        });

        function validateCSVContent(rows) {
            if (rows.length < 2) {
                throw new Error('CSV file must contain at least one student');
            }
            
            const header = rows[0];
            const requiredColumns = ['First Name', 'Last Name'];
            
            for (const column of requiredColumns) {
                if (!header.includes(column)) {
                    throw new Error(`CSV file must contain a "${column}" column`);
                }
            }
            
            return true;
        }

        function setLoading(isLoading) {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.disabled = isLoading;
                if (isLoading) {
                    button.dataset.originalText = button.textContent;
                    button.textContent = 'Loading...';
                } else if (button.dataset.originalText) {
                    button.textContent = button.dataset.originalText;
                }
            });
        }

        function sanitizeStudentName(firstName, lastName) {
            // Remove any HTML tags and trim whitespace
            const sanitized = {
                first: firstName.replace(/[<>]/g, '').trim(),
                last: lastName.replace(/[<>]/g, '').trim()
            };
            
            if (!sanitized.first || !sanitized.last) {
                throw new AppError('Student must have both first and last name');
            }
            
            return `${sanitized.first} ${sanitized.last}`;
        }

        function addSearchFeature() {
            const searchDiv = document.createElement('div');
            searchDiv.className = 'search-container';
            searchDiv.innerHTML = `
                <input type="text" id="studentSearch" placeholder="Search students...">
            `;
            document.querySelector('.controls').insertBefore(searchDiv, document.getElementById('uploadCSV'));

            document.getElementById('studentSearch').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const filteredList = studentList.filter(student => 
                    student.toLowerCase().includes(searchTerm)
                );
                updateDisplay(`Search Results:\n\n${filteredList.join('\n')}`);
            });
        }

        window.addEventListener('beforeunload', (e) => {
            if (studentList.length > 0 && !localStorage.getItem("studentList")) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        function exportToCSV() {
            const csvContent = [
                ['First Name', 'Last Name'],
                ...studentList.map(student => student.split(' '))
            ].map(row => row.join(',')).join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'student_list.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        function updateProgressBar() {
            const total = studentList.length;
            const remaining = shuffledStudents.length;
            const percent = ((total - remaining) / total) * 100;
            
            const progressBar = document.createElement('div');
            progressBar.className = 'progress';
            progressBar.innerHTML = `
                <div class="progress-bar" style="width: ${percent}%">
                    ${Math.round(percent)}%
                </div>
            `;
        }

        function validateStudentName(name) {
            // Remove extra spaces and normalize whitespace
            name = name.replace(/\s+/g, ' ').trim();
            
            const [firstName, lastName] = name.split(' ');
            
            if (!firstName || !lastName) {
                throw new Error('Student must have both first and last name');
            }
            
            if (firstName.length < 2 || lastName.length < 2) {
                throw new Error('Names must be at least 2 characters long');
            }
            
            // Allow letters, spaces, hyphens, apostrophes, and accented characters
            const nameRegex = /^[a-zA-ZÀ-ÿ\s'-]+$/;
            if (!nameRegex.test(name)) {
                throw new Error('Names can only contain letters, spaces, hyphens, and apostrophes');
            }
            
            return {
                firstName: firstName.charAt(0).toUpperCase() + firstName.slice(1).toLowerCase(),
                lastName: lastName.charAt(0).toUpperCase() + lastName.slice(1).toLowerCase()
            };
        }

        function showConfirmDialog(message) {
            return new Promise((resolve) => {
                const dialog = document.createElement('div');
                dialog.className = 'modal';
                dialog.style.display = 'block';
                dialog.innerHTML = `
                    <h3>${message}</h3>
                    <button onclick="closeConfirmDialog(true)">Yes</button>
                    <button onclick="closeConfirmDialog(false)">No</button>
                `;
                
                const backdrop = document.getElementById('modalBackdrop');
                backdrop.style.display = 'block';
                
                document.body.appendChild(dialog);
                
                window.closeConfirmDialog = function(result) {
                    dialog.remove();
                    backdrop.style.display = 'none';
                    resolve(result);
                    delete window.closeConfirmDialog;
                };
            });
        }

        async function reset() {
            try {
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.style.display = 'block';
                modal.innerHTML = `
                    <h2 id="resetModalTitle">Reset Options</h2>
                    <p id="resetModalDesc">How would you like to restart the list?</p>
                    <div role="dialog" 
                         aria-labelledby="resetModalTitle" 
                         aria-describedby="resetModalDesc">
                        <button id="sameOrder" aria-label="Reset with same student order">Use Same Order</button>
                        <button id="newOrder" aria-label="Reset with new random order">New Random Order</button>
                        <button id="cancelReset" aria-label="Cancel reset">Cancel</button>
                    </div>
                `;

                const backdrop = document.getElementById('modalBackdrop');
                backdrop.style.display = 'block';
                document.body.appendChild(modal);

                return new Promise((resolve, reject) => {
                    const cleanup = () => {
                        modal.remove();
                        backdrop.style.display = 'none';
                    };

                    const handleError = (error) => {
                        cleanup();
                        reject(error);
                    };

                    try {
                        modal.querySelector('#sameOrder').addEventListener('click', () => {
                            try {
                                shuffledStudents = [...previousOrder];
                                updateDisplay("Student list has been reset with the same order. Ready to begin!");
                                enableButtons(true);
                                updateStudentCount();
                                cleanup();
                                resolve();
                            } catch (error) {
                                handleError(error);
                            }
                        });

                        modal.querySelector('#newOrder').addEventListener('click', () => {
                            try {
                                shuffleStudents();
                                updateDisplay("Student list has been reset with a new random order. Ready to begin!");
                                enableButtons(true);
                                updateStudentCount();
                                cleanup();
                                resolve();
                            } catch (error) {
                                handleError(error);
                            }
                        });

                        modal.querySelector('#cancelReset').addEventListener('click', () => {
                            cleanup();
                            resolve();
                        });
                    } catch (error) {
                        handleError(error);
                    }
                });
            } catch (error) {
                handleError(error, 'resetting student list');
            }
        }

        const buttons = modal.querySelectorAll('button');
        const firstButton = buttons[0];
        const lastButton = buttons[buttons.length - 1];

        // Handle tab navigation
        modal.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                if (e.shiftKey && document.activeElement === firstButton) {
                    e.preventDefault();
                    lastButton.focus();
                } else if (!e.shiftKey && document.activeElement === lastButton) {
                    e.preventDefault();
                    firstButton.focus();
                }
            } else if (e.key === 'Escape') {
                modal.querySelector('#cancelReset').click();
            }
        });

        // Focus first button when modal opens
        firstButton.focus();

        function storePreviousOrder() {
            if (shuffledStudents.length > 0) {
                previousOrder = [...shuffledStudents];
                // Optionally store in localStorage for persistence
                localStorage.setItem('previousOrder', JSON.stringify(previousOrder));
            }
        }
    </script>
</body>
</html>
